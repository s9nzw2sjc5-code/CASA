name: Precios de Mercadona

# Cada día descarga los precios públicos de la tienda online de Mercadona
# (casa/mercadona.json) para el código postal guardado en tools/mercadona-cp.txt.
# Para cambiar de código postal: Actions → Precios de Mercadona → Run workflow.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      cp:
        description: 'Código postal (déjalo vacío para usar el guardado)'
        required: false

permissions:
  contents: write

concurrency:
  group: mercadona
  cancel-in-progress: true

jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/mercadona.py $CP
        env:
          CP: ${{ github.event.inputs.cp }}
      - name: Guardar si han cambiado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898733+github-actions[bot]@users.noreply.github.com'
          git add casa/mercadona.json tools/mercadona-cp.txt
          git diff --cached --quiet || (git commit -m 'Precios de Mercadona actualizados' && git push)
