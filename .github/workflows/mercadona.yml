name: Precios de Mercadona

# Cada día descarga los precios públicos de la tienda online de Mercadona
# (casa/mercadona.json) para que la app calcule lo que cuesta el menú.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mercadona
  cancel-in-progress: true

jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/mercadona.py 2623  # almacén del CP 18210 (Granada)
      - name: Guardar si han cambiado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898733+github-actions[bot]@users.noreply.github.com'
          git add casa/mercadona.json
          git diff --cached --quiet || (git commit -m 'Precios de Mercadona actualizados' && git push)
