name: Publicar la app Casa

on:
  push:
    branches: [main, claude/deploy-app-outside-claude-ccdb78]
    paths: ['casa/**', 'bingo/**', 'index.html', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # La raíz redirige a casa/, así la dirección funciona igual que publicando desde la rama
      - run: mkdir _site && cp -r index.html .nojekyll casa bingo _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
