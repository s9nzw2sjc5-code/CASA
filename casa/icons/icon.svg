<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6A2B"/><stop offset=".55" stop-color="#F0306F"/><stop offset="1" stop-color="#7B3FF2"/>
    </linearGradient>
    <linearGradient id="dog" gradientUnits="userSpaceOnUse" x1="160" y1="230" x2="360" y2="400">
      <stop offset="0" stop-color="#F0306F"/><stop offset="1" stop-color="#9B3FE0"/>
    </linearGradient>
  </defs>
  <rect id="fondo" width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- casa -->
  <g fill="#fff">
    <path d="M108 252 L256 114 L404 252" fill="none" stroke="#fff" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M148 236 L256 136 L364 236 V388 a22 22 0 0 1 -22 22 H170 a22 22 0 0 1 -22 -22 Z"/>
  </g>
  <!-- bichón maltés (de perfil, mirando a la izquierda) -->
  <g fill="url(#dog)">
    <!-- cuerpo: pelo largo y liso que cae hasta el suelo, con ondas abajo -->
    <path d="M208 300 C236 290 292 290 320 296 C338 300 345 316 343 336
             C345 356 352 378 356 394
             Q346 405 334 396 Q322 406 310 396 Q298 406 286 396 Q274 406 262 396
             Q250 406 238 396 Q226 406 214 396 Q206 401 198 394
             C204 372 200 336 208 300 Z"/>
    <!-- cola en penacho que cae sobre el lomo -->
    <path d="M300 300 C292 268 316 248 342 256 C366 264 372 292 362 316
             C358 330 352 344 348 358 C346 330 340 306 322 298 Z"/>
    <!-- cabeza -->
    <circle cx="204" cy="270" r="33"/>
    <!-- hocico -->
    <ellipse cx="170" cy="283" rx="17" ry="12.5"/>
    <!-- moño -->
    <ellipse cx="202" cy="236" rx="11" ry="12"/>
    <!-- orejas: pelo largo que cae desde la cabeza casi hasta el suelo -->
    <path d="M194 262 C178 300 184 350 198 386 Q210 396 222 386 Q232 392 238 380
             C248 348 246 298 228 262 Z"/>
  </g>
  <!-- lacito, ojo y nariz -->
  <g fill="#fff">
    <path d="M202 230 L189 222 L189 238 Z M202 230 L215 222 L215 238 Z"/><circle cx="202" cy="230" r="3.8"/>
    <circle cx="189" cy="266" r="5"/>
    <circle cx="155" cy="279" r="5.5"/>
  </g>
</svg>
