<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#F6F5FB">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa</title>
<meta name="description" content="Tareas, compras, calendario, menú y cuidados de Ringo para la casa.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=3">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Casa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2EEEC; --surface:#FFFBF0; --ink:#3A0E1B; --muted:#7A5560; --line:#E4CFD4;
  --accent:#5C1428; --accent-ink:#FFF8EC; --accent-soft:#F7D3E0;
  --warn:#5C1428; --warn-soft:#F7D3E0; --danger:#B3261E; --done:#B39CA2;
  --font:"Bricolage Grotesque", ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C0D12; --surface:#2A141A; --ink:#FBEFE8; --muted:#C9A7AF; --line:#4A2630;
    --accent:#F2A9C2; --accent-ink:#2A0A13; --accent-soft:#4A1E2B;
    --warn:#F2A9C2; --warn-soft:#4A1E2B; --danger:#FF8A80; --done:#7E6168;
  }
}
:root[data-theme="dark"]{
  --bg:#1C0D12; --surface:#2A141A; --ink:#FBEFE8; --muted:#C9A7AF; --line:#4A2630;
  --accent:#F2A9C2; --accent-ink:#2A0A13; --accent-soft:#4A1E2B;
  --warn:#F2A9C2; --warn-soft:#4A1E2B; --danger:#FF8A80; --done:#7E6168;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:20px 18px 120px}
h1{font-size:2.1rem;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;line-height:1.05}
h2{font-size:1rem;font-weight:600;margin:26px 0 8px;color:var(--muted)}
.sub{color:var(--muted);margin:0 0 14px}
.hint{color:var(--muted);font-size:.85rem;margin:6px 0 0}

/* Hoy: el número del día es el elemento protagonista */
.today-hero{display:flex;align-items:flex-end;gap:14px;margin:4px 0 18px}
.today-num{font-size:6.2rem;font-weight:800;line-height:.82;letter-spacing:-.05em;color:var(--accent)}
.today-txt{padding-bottom:6px}
.today-txt b{display:block;font-size:1.5rem;font-weight:800;text-transform:capitalize;line-height:1.1}
.today-txt span{color:var(--muted)}

.list{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;overflow:hidden;border:1.5px solid var(--accent)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:52px}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;cursor:pointer}
.row-title{font-weight:500;overflow-wrap:anywhere}
.row-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.82rem;color:var(--muted);margin-top:1px}
.row-meta:empty{display:none}
.row-side{font-size:.85rem;color:var(--muted);white-space:nowrap}
.is-done .row-title{text-decoration:line-through;color:var(--done)}
.late{color:var(--danger);font-weight:600}
.who{color:var(--accent);font-weight:600}
.tag{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.ghost{opacity:.55}

.check{flex:none;width:26px;height:26px;border:2px solid var(--muted);display:grid;place-items:center}
.check.round{border-radius:50%}
.check.sq{border-radius:7px}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on::after{content:"";width:10px;height:6px;border:solid var(--accent-ink);border-width:0 0 2.5px 2.5px;transform:translateY(-1px) rotate(-45deg)}
.check[disabled]{border-style:dashed;cursor:default}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;font-size:.92rem;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--muted)}

.quick{display:flex;gap:8px;margin:14px 0 0}
.quick input,.quick select{min-width:0}
.field{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
.field:focus{border-color:var(--accent);outline:none}
.btn{padding:11px 16px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;white-space:nowrap}
.btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.link{color:var(--accent);font-weight:600;font-size:.92rem}
.head-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

/* Productos habituales */
.staples{display:flex;gap:10px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.staples::-webkit-scrollbar{display:none}
.staple{flex:none;width:132px;padding:12px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);display:flex;flex-direction:column;gap:2px;text-align:left}
.staple{border-color:var(--accent)}
.staple.low{background:var(--warn-soft);border-color:var(--warn)}
.staple b{font-weight:600;overflow-wrap:anywhere}
.staple small{color:var(--muted);font-size:.8rem}
.staple .st-act{margin-top:6px;font-size:.85rem;font-weight:600;color:var(--accent)}
.staple.low .st-act{color:var(--warn)}
.staple.new{border-style:dashed;justify-content:center;align-items:center;color:var(--muted);min-height:96px}

.sec-head{padding:8px 14px;font-size:.85rem;font-weight:600;color:var(--accent-ink);background:var(--accent);border-top:1px solid var(--accent)}
.list .sec-head:first-child{border-top:0}

.summary{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.empty{color:var(--muted);background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:16px;text-align:center}

/* Semana */
.week-nav{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.week-nav .lbl{flex:1;font-weight:600}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:1.1rem;display:grid;place-items:center}
.day{margin-top:14px}
.day-h{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.day-h b{font-size:1.15rem;font-weight:800;text-transform:capitalize}
.day-h span{color:var(--muted);font-size:.9rem}
.day-h .plus{margin-left:auto}
.day.is-today .day-h b{color:var(--accent)}
.day .empty{padding:10px;font-size:.9rem;text-align:left}

/* Barra inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:.66rem;font-weight:500;color:var(--muted)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent-ink);background:var(--accent)}
.badge{min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--danger);color:#fff;font-size:.65rem;line-height:16px;font-weight:700;position:absolute;transform:translate(12px,-4px)}
.tab .ic{position:relative;display:grid;place-items:center}

.fab{position:fixed;right:max(18px, calc(50% - 262px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-size:1.9rem;font-weight:400;line-height:1;box-shadow:0 6px 18px rgba(92,20,40,.3);z-index:4}

/* Hoja inferior */
.overlay{position:fixed;inset:0;background:rgba(10,16,30,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{margin:0 0 14px;font-size:1.35rem;font-weight:800}
.sheet label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin:12px 0 5px}
.sheet .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .actions{display:flex;gap:10px;margin-top:20px}
.sheet .actions .btn{flex:1}
.sheet textarea{resize:vertical;min-height:70px}
.toggle-line{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:.95rem}
.toggle-line input{width:20px;height:20px;accent-color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.meal{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:52px;width:100%;text-align:left}
.meal:first-child{border-top:0}
.meal-k{flex:none;width:56px;font-size:.82rem;font-weight:600;color:var(--muted)}
.meal-v{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.meal-v.empty-slot{color:var(--done);font-weight:400}
.ing-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ing-row:first-child{border-top:0}
.ing-row input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.ing-row span{flex:1}
.ing-row small{color:var(--muted)}
.btn[disabled]{opacity:.5;cursor:default}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.mhead{text-align:center;font-size:.75rem;font-weight:700;color:var(--muted);padding:2px 0}
.mcell{aspect-ratio:1/1.12;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;padding-top:7px;font-weight:600;font-size:.92rem;gap:4px}
.mcell.today{color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.mcell.sel{background:var(--accent);color:var(--accent-ink)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:30px}
.dots i,.mlegend i{width:6px;height:6px;border-radius:50%;display:inline-block}
.mcell.sel .dots i{box-shadow:0 0 0 1.5px var(--accent-ink)}
.mlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:10px 0 0}
.mlegend span{display:flex;align-items:center;gap:5px}
.ev-time{flex:none;min-width:58px;padding:6px 8px;border-radius:10px;background:color-mix(in srgb,var(--c-evento) 16%,var(--surface));color:var(--c-evento);font-size:.78rem;font-weight:700;text-align:center;line-height:1.2}
.ev-row{box-shadow:inset 4px 0 0 var(--c-evento)}
.bk-btns .btn{white-space:normal;line-height:1.2}
.toast-undo{margin-left:14px;color:inherit;font-weight:800;text-decoration:underline}
/* Tareas: filas compactas */
body[data-view="tareas"] .row{padding:7px 12px;min-height:40px;gap:10px}
body[data-view="tareas"] .row-title{font-size:.94rem;line-height:1.25}
body[data-view="tareas"] .row-meta{font-size:.74rem;margin-top:0;gap:2px 8px}
body[data-view="tareas"] .check{width:21px;height:21px;border-width:1.8px}
body[data-view="tareas"] .check.on::after{width:8px;height:5px}
body[data-view="tareas"] .row .btn{padding:5px 8px!important;font-size:.74rem!important}
body[data-view="tareas"] h2{margin:18px 0 6px;font-size:.98rem}
body[data-view="tareas"] .hero{padding:14px 90px 14px 18px;border-radius:22px;margin-bottom:12px}
body[data-view="tareas"] .hero h1{font-size:1.7rem}
body[data-view="tareas"] .hero::after{font-size:3.8rem;bottom:-10px}
/* Hoy: diseño destacado */
.hoy-hero{position:relative;overflow:hidden;border-radius:30px;padding:18px 20px 16px;color:#fff;background:linear-gradient(135deg,#FF6A2B 0%,#F0306F 55%,#7B3FF2 100%);box-shadow:0 14px 34px rgba(240,48,111,.30);margin-bottom:16px}
.hoy-hero::before,.hoy-hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.13);pointer-events:none}
.hoy-hero::before{width:230px;height:230px;right:-80px;top:-90px}
.hoy-hero::after{width:150px;height:150px;left:-60px;bottom:-70px}
.hoy-top{display:flex;justify-content:space-between;align-items:center;position:relative}
.hoy-greet{font-weight:700;font-size:1.05rem}
.ring-box{position:relative;width:54px;height:54px;flex:none}
.ring{width:54px;height:54px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(255,255,255,.3);stroke-width:5}
.ring-fg{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;transition:stroke-dasharray .5s}
.ring-n{position:absolute;inset:0;display:grid;place-items:center;font-size:.78rem;font-weight:800}
.hoy-date{display:flex;align-items:flex-end;gap:12px;margin:4px 0 14px;position:relative}
.hoy-num{font-size:5.8rem;font-weight:800;line-height:.85;letter-spacing:-.05em;text-shadow:0 4px 18px rgba(0,0,0,.12)}
.hoy-wd{padding-bottom:6px;font-weight:500}
.hoy-wd b{display:block;font-size:1.6rem;font-weight:800;text-transform:capitalize;line-height:1.05}
.hoy-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:relative}
.hstat{background:rgba(255,255,255,.2);border-radius:16px;padding:9px 2px 7px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px}
.hstat b{font-size:1.3rem;font-weight:800;line-height:1}
.hstat small{font-size:.7rem;font-weight:600}
.hoy-msg{margin:12px 2px 0;font-weight:600;position:relative}
.next-ev{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;margin-top:16px;padding:16px 18px;border-radius:24px;background:linear-gradient(135deg,var(--c-evento),color-mix(in srgb,var(--c-evento) 60%,var(--c-semana)));color:var(--tab-ink);box-shadow:0 10px 24px color-mix(in srgb,var(--c-evento) 35%,transparent)}
.next-ev .ne-k{font-size:.82rem;font-weight:700;opacity:.92}
.next-ev b{font-size:1.35rem;font-weight:800;line-height:1.15}
.hsec{margin-top:16px;padding:12px;border-radius:24px;background:color-mix(in srgb,var(--sc) 11%,var(--bg))}
.hsec-h{display:flex;align-items:center;gap:10px;margin:2px 4px 10px}
.hsec-h h2{margin:0;flex:1;font-size:1.05rem}
.hsec-ic{flex:none;width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:var(--sc);font-size:1rem;box-shadow:0 4px 10px color-mix(in srgb,var(--sc) 35%,transparent)}
.hsec .list{box-shadow:none}
.hsec .empty{background:var(--surface);border-color:transparent}
.hsec.imp{margin:0 0 16px;background:color-mix(in srgb,var(--c-recordar) 24%,var(--bg));box-shadow:inset 0 0 0 2px var(--c-recordar),0 8px 22px color-mix(in srgb,var(--c-recordar) 30%,transparent)}
.hsec.imp h2{font-size:1.15rem}
.hsec.imp .row-title{font-weight:700}
.notebox{background:var(--surface);border-radius:22px;padding:12px;margin:0 0 14px;box-shadow:var(--shadow)}
.notebox textarea{resize:none;min-height:46px;max-height:140px;field-sizing:content}
.nb-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.nb-btns .btn{padding:10px 8px;font-size:.9rem}
.msg{position:relative;border-radius:18px;padding:12px 40px 12px 14px;margin:0 0 10px;background:linear-gradient(135deg,color-mix(in srgb,var(--c-menu) 22%,var(--surface)),color-mix(in srgb,var(--c-tareas) 16%,var(--surface)));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c-menu) 55%,transparent)}
.msg.mine{background:color-mix(in srgb,var(--c-menu) 8%,var(--surface));box-shadow:inset 0 0 0 1.5px var(--line)}
.msg-h{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;font-weight:700;color:var(--c-menu)}
.msg-h small{color:var(--muted);font-weight:500;white-space:nowrap}
.msg p{margin:4px 0 0;font-size:1.15rem;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.mine p{font-size:1rem}
.msg-x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;color:var(--muted);font-size:.9rem}
.note-t{white-space:pre-wrap}
.ev-when{font-weight:700;color:var(--c-evento)}
.imp-n{min-width:26px;height:26px;padding:0 8px;border-radius:99px;background:var(--c-recordar);color:#1A1530;font-weight:800;font-size:.85rem;display:grid;place-items:center}
.sync{font-size:.75rem;color:var(--muted);text-align:center;margin-top:28px}

/* ===== Diseño multicolor: un color por pestaña ===== */
:root{--bg:#F6F5FB;--surface:#FFFFFF;--ink:#1A1530;--muted:#6B6585;--line:#E6E3F0;--danger:#E5384B;--done:#B2ADC4;
  --shadow:0 2px 12px rgba(26,21,48,.07);--tab-ink:#FFFFFF;
  --c-hoy:#E4510F;--c-tareas:#6C3CF0;--c-compras:#00965F;--c-menu:#E62A68;--c-semana:#1877D6;--c-recordar:#F5B700;--c-ringo:#0B9A9A;--c-evento:#C026D3;
  --accent:var(--c-hoy);--accent-ink:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12101C;--surface:#1D1A2B;--ink:#F3F1FA;--muted:#A9A3C2;--line:#2E2A42;--danger:#FF6B7A;--done:#625D78;
  --shadow:0 0 0 1px #2A2640;--tab-ink:#12101C;
  --c-hoy:#FF8A5B;--c-tareas:#A98BFF;--c-compras:#3DD69A;--c-menu:#FF6E9C;--c-semana:#5AB0FF;--c-recordar:#FFD23F;--c-ringo:#3FD3CF;--c-evento:#E879F9;--accent-ink:#12101C}}
:root[data-theme="dark"]{
  --bg:#12101C;--surface:#1D1A2B;--ink:#F3F1FA;--muted:#A9A3C2;--line:#2E2A42;--danger:#FF6B7A;--done:#625D78;
  --shadow:0 0 0 1px #2A2640;--tab-ink:#12101C;
  --c-hoy:#FF8A5B;--c-tareas:#A98BFF;--c-compras:#3DD69A;--c-menu:#FF6E9C;--c-semana:#5AB0FF;--c-recordar:#FFD23F;--c-ringo:#3FD3CF;--c-evento:#E879F9;--accent-ink:#12101C}
body{--emo:"☀️"}
body[data-view="tareas"]{--accent:var(--c-tareas);--emo:"✅"}
body[data-view="compras"]{--accent:var(--c-compras);--emo:"🛒"}
body[data-view="menu"]{--accent:var(--c-menu);--emo:"🍝"}
body[data-view="semana"]{--accent:var(--c-semana);--emo:"🗓️"}
body[data-view="ringo"]{--accent:var(--c-ringo);--emo:"🐶"}
body[data-view="recordar"]{--accent:var(--c-recordar);--accent-ink:#1A1530;--emo:"⏰"}
body{--accent-soft:color-mix(in srgb,var(--accent) 16%,var(--surface));--warn:var(--accent);--warn-soft:var(--accent-soft)}
main{padding-bottom:150px}
.hero,.today-hero{background:var(--accent);color:var(--accent-ink);border-radius:28px;padding:22px 110px 22px 22px;margin:0 0 18px;position:relative;overflow:hidden}
.today-hero{padding-top:26px}
.hero::after,.today-hero::after{content:var(--emo);position:absolute;right:-4px;bottom:-16px;font-size:5.6rem;line-height:1;transform:rotate(-12deg);pointer-events:none}
.hero h1{margin:0;color:inherit;font-size:clamp(1.7rem,7.5vw,2.3rem);position:relative;z-index:1}
.hero .sub{color:inherit;opacity:.85;margin:4px 0 0;font-weight:500}
.today-num,.today-txt span{color:inherit}
.today-txt span{opacity:.85}
h2{color:var(--ink);font-weight:800;font-size:1.08rem;letter-spacing:-.01em}
.list{border:0;border-radius:20px;box-shadow:var(--shadow)}
.summary{border:0;border-radius:20px;box-shadow:var(--shadow)}
.empty{border-radius:20px}
.chip{border:0;box-shadow:var(--shadow);padding:8px 15px}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chip.add{background:transparent;box-shadow:none;border:1.5px dashed var(--line)}
.btn{border-radius:16px}
.btn.sec{border:0;box-shadow:var(--shadow)}
.field{border-radius:16px;border-color:var(--line)}
.iconbtn{border:0;box-shadow:var(--shadow);border-radius:14px}
.staple{border:0;border-radius:20px;box-shadow:var(--shadow)}
.staple.low{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.staple.new{box-shadow:none;border:1.5px dashed var(--line)}
.sec-head{background:var(--accent-soft);color:var(--ink);border-top:0;font-weight:700}
.check.on{background:var(--accent);border-color:var(--accent)}
nav.tabs{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;border:0;border-radius:26px;padding:6px;box-shadow:0 10px 30px rgba(26,21,48,.18)}
.tab{border-radius:18px;padding:7px 0}
.tab:not(.on) svg{stroke:var(--tc)}
.tab.on{background:var(--tc);color:var(--ti,var(--tab-ink))}
.fab{bottom:calc(100px + env(safe-area-inset-bottom,0px));border-radius:20px;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 45%,transparent)}
.sheet{border-radius:28px 28px 0 0}
.toast{bottom:calc(170px + env(safe-area-inset-bottom,0px))}
/* Estructura de pantalla fija: la barra inferior forma parte del diseño y no depende de position:fixed (Safari) */
html{height:100%;overflow:hidden}
body{height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
main{flex:1;min-height:0;width:100%;max-width:none;margin:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:20px max(18px, calc(50% - 262px)) 40px}
nav.tabs{position:relative;left:auto;right:auto;bottom:auto;flex:none;align-self:center;width:calc(100% - 20px);max-width:560px;margin:0 0 10px;padding:6px}
.fab{position:absolute;bottom:96px;right:max(18px, calc(50% - 262px))}
.toast{position:absolute;bottom:170px}
.overlay{position:absolute}
/* Aire común con Hoy: degradados y secciones */
body{--g2:var(--c-semana)}
body[data-view="hoy"]{--g2:var(--c-menu)}
body[data-view="tareas"]{--g2:var(--c-menu)}
body[data-view="compras"]{--g2:var(--c-semana)}
body[data-view="semana"]{--g2:var(--c-tareas)}
body[data-view="ringo"]{--g2:var(--c-compras)}
body[data-view="recordar"]{--g2:var(--c-hoy)}
body{background:radial-gradient(130% 42% at 50% 0%,var(--accent-soft),var(--bg) 75%) var(--bg)}
.hero{background:linear-gradient(135deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 45%,var(--g2)) 100%);padding:20px;border-radius:30px;box-shadow:0 14px 30px color-mix(in srgb,var(--accent) 30%,transparent)}
.hero::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.14);right:-80px;top:-90px;pointer-events:none}
.hero::after{right:8px;top:10px;bottom:auto;font-size:3.6rem;transform:rotate(-10deg)}
.hero h1,.hero .sub{padding-right:72px;position:relative}
.hero-stats{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:14px;position:relative}
.hero .hstat{background:rgba(255,255,255,.22);color:inherit;border-radius:16px;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px}
.hero .hstat b{font-size:1.25rem;font-weight:800;line-height:1}
.hero .hstat small{font-size:.7rem;font-weight:600;text-align:center}
body[data-view="tareas"] .hero{padding:14px 16px}
body[data-view="tareas"] .hero::after{font-size:3rem;top:8px}
body[data-view="tareas"] .hero-stats{margin-top:10px;gap:6px}
body[data-view="tareas"] .hero .hstat{padding:6px 2px 5px}
body[data-view="tareas"] .hero .hstat b{font-size:1.05rem}
body:not([data-view="hoy"]) main h2{display:flex;align-items:center;gap:9px}
body:not([data-view="hoy"]) main h2::before{content:"";flex:none;width:12px;height:12px;border-radius:4px;background:linear-gradient(135deg,var(--accent),var(--g2));box-shadow:0 3px 8px color-mix(in srgb,var(--accent) 40%,transparent)}
.list{box-shadow:0 4px 16px color-mix(in srgb,var(--accent) 10%,transparent),var(--shadow)}
.chip.on,.btn:not(.sec):not(.danger),.mcell.sel{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--g2)))}
.fab{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 50%,var(--g2)))}
.staple.low{background:linear-gradient(160deg,var(--accent-soft),color-mix(in srgb,var(--g2) 10%,var(--surface)))}
/* Barra superior de respaldo: aparece solo si la barra inferior no se ve en pantalla */
.toptabs{display:none;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;padding:2px}
.toptabs::-webkit-scrollbar{display:none}
body.nav-hidden .toptabs{display:flex}
.toptab{flex:none;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);font-size:.85rem;font-weight:600;color:var(--ink)}
.toptab svg{width:16px;height:16px;stroke:var(--tc);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toptab.on{background:var(--tc);color:var(--ti,var(--tab-ink))}
.toptab.on svg{stroke:currentColor}
body{padding-bottom:var(--nav-off,0px)}
.fab{bottom:calc(96px + var(--nav-off,0px))}
.toast{bottom:calc(170px + var(--nav-off,0px))}
/* Barra de pestañas arriba (elegida por la usuaria en este dispositivo) */
body.nav-top nav.tabs{display:none}
body.nav-top{padding-bottom:0}
body.nav-top .toptabs{display:flex;position:sticky;top:-20px;z-index:3;margin:-20px -18px 12px;padding:10px 18px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
body.nav-top .fab{bottom:24px}
body.nav-top .toast{bottom:90px}
.navq{background:var(--surface);box-shadow:var(--shadow);border-radius:20px;padding:14px;margin:0 0 14px;font-weight:600}
.navq div{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.navq .btn{flex:1;padding:9px 10px;font-size:.88rem;white-space:normal}
/* Cocina */
.product-sheet-photo{display:block;width:88px;height:88px;object-fit:contain;background:#fff;border-radius:12px;margin:0 auto 8px}
.product-units{display:flex;align-items:center;gap:4px}
.product-units .field{min-width:0;text-align:center;padding:10px 2px}
.product-units .btn{padding:10px;min-width:36px}
.product-more{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.product-more summary{cursor:pointer;font-weight:600;padding:8px 0;min-height:44px}
.ck-tabs{margin-top:-4px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible;gap:8px}
.ck-tabs .chip{min-width:0;min-height:44px;padding:8px 6px;white-space:normal;font-size:.85rem}
.ck-n{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--danger);color:#fff;font-size:.7rem;font-weight:800;margin-left:2px}
.ck-actions{display:flex;gap:8px;flex-wrap:wrap}
.ck-actions .btn{flex:1}
.ck-budget{margin-top:12px;background:var(--surface);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.ck-bl{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ck-bl b{font-size:1.4rem;font-weight:800}
.ck-bl span,.ck-budget small{color:var(--muted);font-size:.85rem}
.ck-bar,.ck-lvl{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.ck-bar i,.ck-lvl i{display:block;height:100%;border-radius:inherit;background:var(--c-compras)}
.ck-budget.over .ck-bar i{background:var(--danger)}
.ck-budget.over b{color:var(--danger)}
.ck-lvl{height:5px;margin:5px 0 3px;max-width:220px}
.ck-pan.low .ck-lvl i{background:var(--danger)}
.ck-pan.low .row-title{color:var(--danger)}
.ck-meal{padding:0;gap:0}
.ck-mm{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 6px 12px 14px;text-align:left;min-height:52px}
.ck-meal.made .meal-v{color:var(--muted)}
.ck-ib{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:1.05rem;color:var(--muted)}
.ck-ib:hover{background:var(--accent-soft);color:var(--ink)}
.ck-src{flex:none;font-size:1.3rem;width:28px;text-align:center}
.ck-wrap{display:flex;flex-wrap:wrap;gap:8px}
.ck-set .row{gap:8px;flex-wrap:wrap}
.ck-num{min-width:28px;text-align:center;font-size:1.15rem}
.ck-pick{display:flex;flex-direction:column;gap:6px;margin:10px 0 0;max-height:38vh;overflow-y:auto}
.ck-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.ck-opt.on{box-shadow:inset 0 0 0 2px var(--accent)}
.ck-opt small{color:var(--muted);font-size:.8rem}
.ck-prod{flex-direction:row;align-items:center;gap:10px}
.ck-prod span{display:flex;flex-direction:column;gap:2px}
.ck-prod img{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:#fff}
.ck-box{background:var(--surface);border-radius:16px;padding:4px 14px;box-shadow:var(--shadow);margin-top:10px}
.ck-ing{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:9px 0;border-top:1px solid var(--line)}
.ck-ing:first-child{border-top:0}
.ck-ing small{color:var(--muted)}
.ck-dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;border:2px solid var(--line)}
.ck-dot.ok{background:var(--c-compras);border-color:var(--c-compras)}
.ck-pr{flex:none;font-size:.9rem}
.ck-total{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:12px}
.ck-total b{font-size:1.3rem}
.ck-total small{color:var(--muted);width:100%}
.ck-stars{display:flex;gap:4px;margin:10px 0}
.ck-stars button{font-size:1.6rem;color:var(--line);line-height:1}
.ck-stars button.on{color:#F5B700}
.ck-ppl{display:flex;align-items:center;gap:4px;font-size:.9rem}
.sheet h4{margin:16px 0 4px;font-size:1rem}
.ck-steps{line-height:1.5}
.ck-buy{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ck-buy:first-child{border-top:0}
.ck-buy>span{flex:1;min-width:0}
.ck-buy small{color:var(--muted)}
.ck-buy input{width:86px;flex:none;text-align:right}
.ck-spent{display:block;width:100%;text-align:left;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:.88rem}
.ck-tl{padding:10px 0;border-top:1px solid var(--line)}
.ck-tl:first-child{border-top:0}
.sheet label.ck-tl-h{display:flex;gap:8px;align-items:center;margin:0}
.ck-tl-h input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.ck-tl-h [data-nm]{flex:1;min-width:0}
.ck-tl-h [data-pr]{width:84px;flex:none;text-align:right}
.ck-tl small{display:block;color:var(--muted);margin:4px 0 6px 28px}
.ck-tl select{margin-left:28px;width:calc(100% - 28px)}
.ck-pre{white-space:pre-wrap;font-size:.75rem;background:var(--surface);padding:10px;border-radius:12px;max-height:30vh;overflow:auto}
.ck-search{position:relative;margin-top:12px}
.ck-search input{padding-right:46px;font-size:1rem}
.ck-search .ck-ib[hidden]{display:none}
.ck-search .ck-ib{position:absolute;right:4px;top:50%;transform:translateY(-50%)}
.ck-cats{margin-top:10px}
.ck-help{margin:8px 0 0}
.ck-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
@media (min-width:640px){.ck-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ck-card{position:relative;background:var(--surface);border-radius:18px;padding:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px}
.ck-card.in{box-shadow:inset 0 0 0 2px var(--accent),var(--shadow)}
.ck-offer{position:absolute;top:8px;left:8px;z-index:1;background:#E5384B;color:#fff;font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:99px}
.ck-ci{aspect-ratio:1;border-radius:12px;background:#fff;overflow:hidden;display:grid;place-items:center}
.ck-ci img{display:block;width:100%;height:100%;object-fit:contain}
.ck-cp{margin-top:4px;font-size:1.05rem}
.ck-cp s{color:var(--muted);font-size:.85rem}
.ck-cp b.red{color:#E5384B}
.ck-cp small{color:var(--muted);font-size:.8rem}
.ck-cn{font-size:.88rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.ck-cs{color:var(--muted);font-size:.74rem;line-height:1.2}
.ck-home{color:var(--c-compras);font-size:.74rem;font-weight:600}
.ck-ca{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:6px}
.ck-add{flex:1;padding:9px 6px;border-radius:12px;background:#F5B700;color:#1A1530;font-weight:700;font-size:.88rem}
.ck-st{flex:none;width:36px;height:36px;border-radius:12px;border:1.5px solid #F5B700;display:grid;place-items:center;font-size:1.05rem;font-weight:700;background:transparent;color:var(--ink)}
.ck-st.plus{background:#F5B700;color:#1A1530}
.ck-u{flex:1;text-align:center;font-size:1rem;min-width:18px}
.ck-home-b{flex:none;height:36px;padding:0 8px;border-radius:12px;background:var(--accent-soft);font-size:.82rem;font-weight:700}
.ck-cartbar{position:sticky;bottom:0;z-index:2;margin:16px -6px 0;padding:8px 6px 4px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.ck-cartbar button{width:100%;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;background:#00965F;color:#fff;box-shadow:0 8px 20px rgba(0,150,95,.35);text-align:left}
.ck-cb-ic{position:relative;font-size:1.4rem}
.ck-cb-ic b{position:absolute;top:-6px;right:-10px;background:#F5B700;color:#1A1530;font-size:.7rem;min-width:18px;height:18px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
.ck-cb-t{flex:1;display:flex;flex-direction:column;line-height:1.15}
.ck-cb-t small{opacity:.85;font-size:.75rem}
.ck-cb-t b{font-size:1.15rem}
.ck-cb-t b.over{color:#FFD23F}
.ck-cb-go{font-weight:700;font-size:.9rem}
.ck-lowbtn{width:100%;margin-top:8px;box-shadow:inset 0 0 0 2px var(--danger)!important;color:var(--danger)}
.ck-pan{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line)}
.ck-pan:first-child{border-top:0}
.ck-pan img,.ck-noimg{width:48px;height:48px;border-radius:12px;object-fit:contain;background:#fff;flex:none;display:grid;place-items:center;font-size:1.4rem}
.ck-pm{flex:1;min-width:0}
.ck-pt{display:block;width:100%;text-align:left;font-weight:600;font-size:.92rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck-pl{color:var(--muted);font-size:.78rem}
.ck-pan.low .ck-pl{color:var(--danger);font-weight:600}
.ck-ib.on{color:var(--c-compras);font-weight:800}
.ck-range{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:4px 0 0;--fill:var(--c-compras)}
.ck-pan.low .ck-range{--fill:var(--danger)}
.ck-range::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:linear-gradient(to right,var(--fill) var(--p),var(--line) var(--p))}
.ck-range::-moz-range-track{height:10px;border-radius:99px;background:linear-gradient(to right,var(--fill) var(--p),var(--line) var(--p))}
.ck-range::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-8px;border-radius:50%;background:#fff;border:3px solid var(--fill);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.ck-range::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--fill)}
.ck-buy .ck-u{flex:none;width:22px}
.ck-buy .ck-st{width:32px;height:32px}
.ck-th{width:40px;height:40px;border-radius:8px;object-fit:contain;background:#fff;flex:none}
.ck-aibtn{width:100%;margin-top:8px;background:linear-gradient(135deg,#6C3CF0,#E62A68)!important;color:#fff!important}
.ck-ai-wait{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 0}
.ck-spin{width:42px;height:42px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:ckspin .8s linear infinite}
@keyframes ckspin{to{transform:rotate(360deg)}}
.ck-money{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ck-mc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.ck-mc small{color:var(--muted);font-size:.74rem;font-weight:600}
.ck-mc b{font-size:1.3rem;font-weight:800;line-height:1.15}
.ck-mc span{color:var(--muted);font-size:.76rem}
.ck-mc.near b{color:#C77700}.ck-mc.over b{color:var(--danger)}
.ck-mbar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.ck-mbar i{display:block;height:100%;background:var(--c-compras);border-radius:inherit}
.ck-mbar.near i{background:#F5A300}.ck-mbar.over i{background:var(--danger)}
.ck-mwarn{grid-column:1/-1;font-weight:700;font-size:.82rem}
.ck-mbtns{grid-column:1/-1;display:flex;gap:8px}
.ck-mbtns .btn{flex:1;padding:9px 8px;font-size:.86rem;white-space:normal}
.ck-it{align-items:flex-start;gap:10px;padding:10px 12px}
.ck-it .check{margin-top:10px}
.ck-ith{width:46px;height:46px;border-radius:10px;object-fit:contain;background:#fff;flex:none}
.ck-ith0{display:grid;place-items:center;font-size:1.2rem;background:var(--accent-soft)}
.ck-irow{display:flex;align-items:center;gap:8px;margin-top:6px}
.ck-st.sm{width:32px;height:32px;font-size:.95rem}
.ck-u2{min-width:22px;text-align:center;font-size:.95rem}
.ck-ipr{margin-left:auto;font-weight:700;font-size:.9rem;white-space:nowrap}
.ck-it.is-done .ck-ith{opacity:.45}
.ck-it.is-done .ck-ipr{color:var(--done);text-decoration:line-through}
.ck-star{color:#F5B700}
.ck-done-h{background:var(--line)!important;color:var(--muted)!important}
.ck-habs{padding-bottom:6px}
.ck-hab{flex:none;width:118px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:3px}
.ck-hab.in{box-shadow:inset 0 0 0 2px var(--c-compras),var(--shadow)}
.ck-hab img,.ck-hab0{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:12px;display:grid;place-items:center;font-size:1.8rem}
.ck-hab b{font-size:.78rem;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}

<body>
<main id="app"></main>
<button class="fab" id="fab" aria-label="Añadir" hidden>+</button>
<nav class="tabs" aria-label="Secciones"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" role="status"></div>

<!-- Fuera de Claude: configuración y sincronización propias -->
<script src="config.js"></script>
<script src="sync.js"></script>
<script src="cocina.js"></script>
<script>
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ds(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const REP={none:'No se repite',daily:'Cada día',every2:'Cada 2 días',every3:'Cada 3 días',weekly:'Cada semana',monthly:'Cada mes',yearly:'Cada año',custom:'Personalizado (cada X…)'};
function relDate(s){
  const n=diff(today(),s);
  if(n===0)return'Hoy'; if(n===1)return'Mañana'; if(n===-1)return'Ayer';
  return parse(s).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
}
function nextDate(s,rep){
  if(rep==='daily')return addDays(s,1);
  if(rep==='every2')return addDays(s,2);
  if(rep==='every3')return addDays(s,3);
  if(rep==='weekly')return addDays(s,7);
  if(rep==='yearly')return addInterval(s,12,'m');
  if(rep==='monthly'){const d=parse(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ds(d)}
  return s;
}
function nextOcc(s,o){return o.repeat==='custom'?(o.every>0?addInterval(s,o.every,o.unit||'m'):addDays(s,1)):nextDate(s,o.repeat)}
function repLabel(o){if(o.repeat!=='custom')return REP[o.repeat]||'';const n=o.every||1;return'Cada '+(n===1?'':n+' ')+(n===1?{d:'día',w:'semana',m:'mes'}:{d:'días',w:'semanas',m:'meses'})[o.unit||'m']}
function occursOn(t,d){
  if(!t.date)return false;
  if(!t.repeat||t.repeat==='none')return t.date===d;
  if(d<t.date)return false;
  if(t.repeat==='daily')return true;
  if(t.repeat==='every2')return diff(t.date,d)%2===0;
  if(t.repeat==='every3')return diff(t.date,d)%3===0;
  if(t.repeat==='weekly')return diff(t.date,d)%7===0;
  if(t.repeat==='monthly')return parse(d).getDate()===parse(t.date).getDate();
  if(t.repeat==='yearly')return d.slice(5)===t.date.slice(5);
  if(t.repeat==='custom'&&t.every>0){const n=t.every,u=t.unit||'m',k=diff(t.date,d);
    if(u==='d')return k%n===0;
    if(u==='w')return k%(7*n)===0;
    const a=parse(t.date),b=parse(d),md=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();
    return md%n===0&&addInterval(t.date,md,'m')===d;}
  return false;
}
function toast(msg,undo){
  const t=$('#toast');t.innerHTML='';const sp=document.createElement('span');sp.textContent=msg;t.appendChild(sp);
  if(undo){const b=document.createElement('button');b.className='toast-undo';b.textContent='Deshacer';b.onclick=()=>{t.classList.remove('show');t.style.pointerEvents='none';undo()};t.appendChild(b);t.style.pointerEvents='auto'}
  else t.style.pointerEvents='none';
  t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>{t.classList.remove('show');t.style.pointerEvents='none'},undo?7000:2200);
}

/* ---------- estado y guardado ---------- */
const LS='casa-app-v1';
function fresh(){return{v:1,updated:0,
  people:[{id:'yo',name:'Mari'},{id:'juanma',name:'Juanma'}],
  tasks:[],
  lists:[{id:'super',name:'Súper'},{id:'farmacia',name:'Farmacia'},{id:'casa',name:'Para la casa'}],
  sections:['Despensa','Fruta y verdura','Frescos','Congelados','Limpieza','Higiene','Otros'],
  shopLater:[],items:[],staples:[],reminders:[],recipes:[],menu:{},secMem:{},pet:[],petLog:[],events:[],notes:[],board:{},pantry:[],cook:{},prodMap:{},prices:{},buys:[]}}
let S=fresh();
try{const r=localStorage.getItem(LS);if(r)S=Object.assign(fresh(),JSON.parse(r))}catch(e){}
let ui={view:'hoy',taskFilter:'pend',personFilter:'all',list:null,week:0};
try{const u=localStorage.getItem(LS+'-ui');if(u)ui=Object.assign(ui,JSON.parse(u))}catch(e){}
let prefRef=null,prefsReady=false;setTimeout(()=>{if(!prefsReady){prefsReady=true;render()}},3000);
let docRef=null,dbRef=null,saveTimer=null,syncState='local';
let lastSaved=null,prevState=null;

function persistLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function toastUndo(msg){
  // Deshace solo lo que cambió esta acción: lo que haya hecho la otra persona mientras tanto se conserva
  const before=prevState,after=lastSaved;if(!before||!after){toast(msg);return}
  toast(msg,()=>{S=merge(clone(after),clone(before),S);save();toast('Deshecho')});
}
function save(){
  prevState=lastSaved;try{lastSaved=JSON.parse(JSON.stringify(S))}catch(e){}
  S.updated=Date.now();persistLocal();
  if(docRef){clearTimeout(saveTimer);saveTimer=setTimeout(pushCloud,700)}
  render();
}
const clone=o=>JSON.parse(JSON.stringify(o));
const stripOld=o=>{if(o){delete o.coupleChecks;delete o.coupleIdea}return o};
const J=JSON.stringify;
let canWrite=true,base=null,pushing=false,pushAgain=false;
try{const bs=localStorage.getItem(LS+'-base');if(bs)base=JSON.parse(bs)}catch(e){}
function saveBase(){try{localStorage.setItem(LS+'-base',J(base))}catch(e){}}
const ARR_KEYS=['people','tasks','lists','items','staples','reminders','recipes','pet','petLog','events','notes','pantry','buys','shopLater'],MAP_KEYS=['menu','secMem','board','cook','prodMap','prices'];
const core=x=>{const o={};[...ARR_KEYS,...MAP_KEYS,'sections'].forEach(k=>o[k]=x[k]);return o};
const dirty=()=>!base||J(core(S))!==J(core(base));
// Fusión a tres bandas: lo que cambió aquí desde la última sincronización se aplica sobre lo remoto
function mergeArr(b,l,r){
  const bm=new Map((b||[]).map(x=>[x.id,x])),lm=new Map((l||[]).map(x=>[x.id,x]));
  const out=new Map((r||[]).map(x=>[x.id,x]));
  lm.forEach((x,id)=>{const bx=bm.get(id);if(!bx||J(bx)!==J(x))out.set(id,x)});
  bm.forEach((x,id)=>{if(!lm.has(id))out.delete(id)});
  return[...out.values()];
}
function merge(b,l,r){
  b=b||{};const o=Object.assign(fresh(),r);
  ARR_KEYS.forEach(k=>o[k]=mergeArr(b[k],l[k],r[k]));
  MAP_KEYS.forEach(k=>{const bb=b[k]||{},ll=l[k]||{},m=Object.assign({},r[k]||{});
    Object.keys(ll).forEach(x=>{if(J(bb[x])!==J(ll[x]))m[x]=ll[x]});
    Object.keys(bb).forEach(x=>{if(!(x in ll))delete m[x]});o[k]=m});
  o.sections=b.sections&&J(l.sections)!==J(b.sections)?l.sections:(r.sections||l.sections);
  return o;
}
async function pushCloud(){
  if(!docRef||!canWrite)return;
  if(pushing){pushAgain=true;return}
  pushing=true;
  try{
    let out,merged=false;
    if(dbRef&&dbRef.transact){
      // Lectura, fusión y escritura en una transacción: dos móviles guardando a la vez no se pisan
      const local=clone(S),b0=base;
      out=await dbRef.transact('hogar/estado',data=>{
        let st=local,rv=0;
        if(data){const r=Object.assign(fresh(),clone(data));rv=r.rev||0;if(!b0||rv!==(b0.rev||0))st=merge(b0,local,r)}
        st=stripOld(clone(st));st.rev=rv+1;st.updated=Date.now();return st;
      });
      merged=J(core(out))!==J(core(local));
      // Lo que se haya tocado mientras se guardaba se aplica encima y se vuelve a guardar
      if(J(core(S))!==J(core(local))){S=merge(local,S,clone(out));S.rev=out.rev;pushAgain=true}else S=clone(out);
    }else{
      const snap=await docRef.get();let rv=0;
      if(snap.exists){const r=Object.assign(fresh(),clone(snap.data()));rv=r.rev||0;
        if(!base||rv!==(base.rev||0)){S=merge(base,S,r);merged=true}}
      S.rev=rv+1;S.updated=Date.now();
      stripOld(S);out=clone(S);
      await docRef.set(out);
    }
    base=clone(out);saveBase();persistLocal();syncState='ok';
    dailyBackup(out);
    if(merged){lastSaved=clone(S);render()}
  }catch(err){
    if(err&&err.code==='invalid_argument'){canWrite=false;syncState='ro';render()}
    else{syncState='err';if(err&&err.code==='unavailable')setTimeout(pushCloud,2000+Math.random()*1000)}
  }
  pushing=false;updSync();
  if(pushAgain){pushAgain=false;pushCloud()}
}
function applyRemote(snap){
  if(!snap||!snap.exists)return;
  if(snap.metadata&&snap.metadata.hasPendingWrites)return;
  const r=stripOld(Object.assign(fresh(),clone(snap.data())));
  // Un aviso atrasado (versión anterior a la que ya tenemos) no debe pisar lo más reciente
  if(base&&(r.rev||0)<(base.rev||0))return;
  if(base&&(r.rev||0)===(base.rev||0)&&J(core(r))===J(core(base))){if(syncState==='local')syncState='ok';updSync();return}
  if(!canWrite||!dirty())S=r;
  else{S=merge(base,S,r);S.rev=r.rev||0;clearTimeout(saveTimer);saveTimer=setTimeout(pushCloud,300)}
  base=clone(r);saveBase();persistLocal();lastSaved=clone(S);
  if(canWrite&&migratePeople())save();else render();
  if(syncState!=='ro')syncState='ok';updSync();
}
async function initCloud(){
  if(!window.claude||!window.claude.use){prefsReady=true;render();return}
  try{
    const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    try{if(await user.can('data.write')===false){canWrite=false;syncState='ro';render()}}catch(e){}
    const id=await user.id();
    // Preferencias de esta persona (posición de las pestañas), guardadas en su cuenta para que no se pierdan
    if(id){prefRef=db.collection('data/users/'+id).doc('prefs');
      try{const ps=await prefRef.get();if(ps.exists){const d=ps.data()||{};if(d.navPos){ui.navPos=d.navPos;ui.navAsked=true}if(d.me)ui.me=d.me}}catch(e){}}
    prefsReady=true;render();
    docRef=db.doc('hogar/estado');dbRef=db;
    const snap=await docRef.get();
    if(!snap.exists){
      if(id){try{const ps=await db.collection('data/users/'+id).doc('estado').get();
        if(ps.exists){S=merge(null,S,Object.assign(fresh(),clone(ps.data())));persistLocal();render()}}catch(e){}}
      pushCloud();
    }else{applyRemote(snap);if(canWrite&&dirty())pushCloud()}
    docRef.onSnapshot(applyRemote,()=>{syncState='err';updSync()});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&docRef)docRef.get().then(applyRemote).catch(()=>{})});
  }catch(e){}
}
function updSync(){const el=$('#sync');if(el)el.textContent=syncText()}
function syncText(){return syncState==='ro'?'Solo lectura: pide que te inviten como editora para hacer cambios':syncState==='ok'?'Sincronizado con la casa':syncState==='err'?'Sin conexión: los cambios se guardan en este dispositivo':'Guardado en este dispositivo'}

/* ---------- búsquedas ---------- */
const BOTH={id:'ambos',name:'Conjunto'};
const person=id=>id==='ambos'?BOTH:S.people.find(p=>p.id===id);
const forPerson=x=>ui.personFilter==='all'||(x.who||'yo')===ui.personFilter||(x.who==='ambos'&&ui.personFilter!=='ambos'?true:false);
function migratePeople(){
  let ch=false;const yo=S.people.find(p=>p.id==='yo');
  if(yo&&yo.name==='Yo'){yo.name='Mari';ch=true}
  if(!S.people.some(p=>norm(p.name)==='juanma')){S.people.push({id:'juanma',name:'Juanma'});ch=true}
  // Quitar personas repetidas (mismo nombre) y pasar sus tareas y eventos a la que se conserva
  const canon=p=>['yo','juanma'].includes(p.id)?0:1;
  const seen=new Map(),remap={};
  [...S.people].sort((a,b)=>canon(a)-canon(b)).forEach(p=>{const k=norm(p.name);if(seen.has(k))remap[p.id]=seen.get(k);else seen.set(k,p.id)});
  if(Object.keys(remap).length){
    S.people=S.people.filter(p=>!remap[p.id]);
    [S.tasks,S.events].forEach(a=>a.forEach(x=>{if(remap[x.who])x.who=remap[x.who]}));
    if(remap[ui.personFilter])ui.personFilter=remap[ui.personFilter];
    ch=true;
  }
  return ch;
}
const curList=()=>S.lists.find(l=>l.id===ui.list)||S.lists[0];
function stapleLeft(s){return s.days-diff(s.last||today(),today())}
function stapleInList(s){return S.items.some(i=>!i.done&&i.listId===s.listId&&norm(i.name)===norm(s.name))}
function stapleLow(s){return stapleLeft(s)<=Math.max(2,Math.round(s.days*.25))}
function autoStaples(){
  let changed=false;
  S.staples.forEach(s=>{
    if(s.auto&&stapleLeft(s)<=1&&!stapleInList(s)&&s.snooze!==today()){
      S.items.push({id:uid(),listId:s.listId,name:s.name,section:s.section||'Otros',qty:'',by:'',done:false,auto:true});changed=true;
    }
  });
  if(changed)save();
}

/* ---------- filas ---------- */
function taskRow(t,occ){
  const p=person(t.who);
  const preview=occ&&occ!==t.date; // repetición futura
  const late=t.date&&t.date<today()&&!t.done;
  const meta=[
    t.date&&!occ?`<span class="${late?'late':''}">${late?'Atrasada · ':''}${relDate(t.date)}${t.time?' a las '+t.time:''}</span>`:(t.time&&t.date?`<span>${t.time}</span>`:''),
    t.repeat&&t.repeat!=='none'?`<span>${repLabel(t)}</span>`:'',
    p?`<span class="who">${esc(p.name)}</span>`:''
  ].join('');
  return`<li class="row ${t.done?'is-done':''} ${preview?'ghost':''}">
    <button class="check round ${t.done?'on':''}" ${preview?'disabled aria-label="Repetición prevista"':`data-act="toggleTask" data-id="${t.id}" aria-label="Completar ${esc(t.title)}"`}></button>
    <div class="row-main" data-act="editTask" data-id="${t.id}"><div class="row-title">${esc(t.title)}</div><div class="row-meta">${meta}</div></div>${late&&!occ?`<button class="btn sec" style="padding:7px 10px;font-size:.8rem;flex:none" data-act="toToday" data-id="${t.id}">Pasar a hoy</button>`:''}${!t.done&&t.date===today()&&(!occ||occ===t.date)?`<button class="btn sec" style="padding:7px 10px;font-size:.8rem;flex:none" data-act="toTomorrow" data-id="${t.id}" aria-label="Pasar ${esc(t.title)} a mañana">Mañana →</button>`:''}</li>`;
}
function eventRow(e,occ,label){
  const p=person(e.who);
  const tm=e.time?(e.end?e.time+'–'+e.end:e.time):'Todo el día';
  const meta=[label?`<span class="ev-when">${label}</span>`:'',!occ&&e.date?`<span>${relDate(e.date)}</span>`:'',e.place?`<span>📍 ${esc(e.place)}</span>`:'',isRep(e)?`<span>${repLabel(e)}</span>`:'',p?`<span class="who">${esc(p.name)}</span>`:''].join('');
  return`<li class="row ev-row"><span class="ev-time">${tm}</span>
    <div class="row-main" data-act="editEvent" data-id="${e.id}"><div class="row-title">${esc(e.title)}</div><div class="row-meta">${meta}</div></div></li>`;
}
function remRow(r,occ){
  const preview=typeof occ==='string'&&occ!==r.date;
  const late=!r.done&&!!r.date&&(r.date<today()||(r.date===today()&&r.time&&r.time<new Date().toTimeString().slice(0,5)));
  return`<li class="row ${r.done?'is-done':''} ${preview?'ghost':''}">
    <button class="check round ${r.done?'on':''}" ${preview?'disabled aria-label="Repetición prevista"':`data-act="toggleRem" data-id="${r.id}" aria-label="Marcar ${esc(r.title)}"`}></button>
    <div class="row-main" data-act="editRem" data-id="${r.id}"><div class="row-title">${esc(r.title)}</div>
    <div class="row-meta"><span class="${late&&!preview?'late':''}">${preview?'':(r.date?relDate(r.date):'Sin fecha')}${r.time&&r.date?(preview?'A las ':' a las ')+r.time:''}</span>${r.repeat&&r.repeat!=='none'?`<span>${repLabel(r)}</span>`:''}${r.notes?`<span>${esc(r.notes.slice(0,40))}</span>`:''}</div></div></li>`;
}
const ul=rows=>`<ul class="list">${rows.join('')}</ul>`;

/* ---------- vistas ---------- */
function heroStats(a){return`<div class="hero-stats">${a.map(([n,l])=>`<span class="hstat"><b>${n}</b><small>${l}</small></span>`).join('')}</div>`}
function vHoy(){
  const t=today(),d=new Date(),hr=d.getHours(),nowHM=pad(hr)+':'+pad(d.getMinutes());
  const greet=hr>=6&&hr<13?'Buenos días':hr>=13&&hr<21?'Buenas tardes':'Buenas noches';
  const late=S.tasks.filter(x=>!x.done&&x.date&&x.date<t);
  const now=S.tasks.filter(x=>!x.done&&x.date===t).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  const doneToday=S.tasks.filter(x=>x.done&&x.doneAt===t);
  const rems=S.reminders.filter(r=>!r.done&&r.date&&r.date<=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  // Recordatorios con fecha concreta (no se repiten): se destacan como importantes
  // (también los de mañana, para verlos con un día de antelación)
  const tm=addDays(t,1);
  const imp=rems.filter(r=>!isRep(r)),repRems=rems.filter(r=>isRep(r));
  // Lo de mañana, para tenerlo presente el día de antes: recordatorios con fecha concreta y eventos del calendario
  // (los eventos que se repiten cada día no se avisan)
  const tmRows=[...S.reminders.filter(r=>!r.done&&!isRep(r)&&r.date===tm).map(r=>[r.time||'99:99',remRow(r)]),
    ...S.events.filter(e=>e.repeat!=='daily'&&occursOn(e,tm)).map(e=>[e.time||'00:00',eventRow(e,tm,'Mañana')])]
    .sort((a,b)=>a[0].localeCompare(b[0])).map(x=>x[1]);
  const impN=imp.length+tmRows.length;
  const low=S.staples.filter(s=>stapleLow(s)&&!stapleInList(s));
  const pend=S.items.filter(i=>!i.done).length;
  const evs=S.events.filter(e=>occursOn(e,t)).sort((a,b)=>(a.time||'00:00').localeCompare(b.time||'00:00'));
  const total=now.length+doneToday.length,done=doneToday.length,pct=total?done/total:0;
  const C=113.1;
  const stat=(n,l,v)=>`<button class="hstat" data-act="tab" data-v="${v}"><b>${n}</b><small>${l}</small></button>`;
  const msg=!total&&!late.length?'Hoy no tienes tareas: día libre ✨':done===total&&!late.length?'¡Todo hecho por hoy! 🎉':late.length?`Tienes ${late.length} atrasada${late.length>1?'s':''} 👀`:`Te ${total-done===1?'queda':'quedan'} ${total-done} para hoy 💪`;
  let h=`<div class="hoy-hero">
    <div class="hoy-top"><span class="hoy-greet">${greet} 👋</span>

/* ---------- Ringo ---------- */
const UNITS={d:'días',w:'semanas',m:'meses'};
const PET_KINDS={pastilla:['💊','Pastilla'],veterinario:['🩺','Veterinario'],collar:['🦮','Collar'],vacuna:['💉','Vacuna'],higiene:['🛁','Higiene'],salud:['🤒','Salud'],peso:['⚖️','Peso'],paseo:['🦴','Actividad'],otro:['🐾','Otro']};
function addInterval(s,n,u){
  if(u==='d')return addDays(s,n);
  if(u==='w')return addDays(s,7*n);
  const d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);
  d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return ds(d);
}
function petDue(x){if(x.next)return x.next;if(x.every>0&&x.last)return addInterval(x.last,x.every,x.unit||'m');return''}
function petWhen(d){
  const n=diff(today(),d);
  if(n<0)return`<span class="late">Atrasado ${-n} día${n===-1?'':'s'}</span>`;
  if(n===0)return'<span class="late">Toca hoy</span>';
  if(n===1)return'<span>Mañana</span>';
  return`<span>En ${n} días · ${parse(d).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:n>300?'numeric':undefined})}</span>`;
}
function petRow(x){
  const d=petDue(x),k=PET_KINDS[x.kind]||PET_KINDS.otro;
  const meta=[d?petWhen(d)+(x.time&&x.next?`<span>a las ${x.time}</span>`:''):'<span>Sin fecha: añádela cuando la tengas</span>',x.every>0?`<span>Cada ${x.every} ${x.every===1?{d:'día',w:'semana',m:'mes'}[x.unit]:UNITS[x.unit]}</span>`:''].join('');
  return`<li class="row"><span style="font-size:1.5rem;flex:none" aria-hidden="true">${k[0]}</span>

}

const LBK=LS+'-copias';
const counts=d=>`${(d.tasks||[]).length} tareas · ${(d.events||[]).length} eventos · ${(d.items||[]).length} productos · ${(d.reminders||[]).length} recordatorios · ${(d.pet||[]).length+(d.petLog||[]).length} de Ringo`;
function localBackups(){try{return JSON.parse(localStorage.getItem(LBK)||'[]')}catch(e){return[]}}
function saveLocalBackup(id,data,label){
  try{let a=localBackups().filter(b=>b.id!==id);a.unshift({id,at:Date.now(),label,data});a=a.slice(0,10);localStorage.setItem(LBK,JSON.stringify(a))}catch(e){}
}
async function cloudBackup(id,data,label){
  if(!dbRef||!canWrite)return false;
  try{await dbRef.collection('copias').doc(id).set({at:Date.now(),label,data:clone(data)});return true}catch(e){return false}
}
async function pruneBackups(){
  try{const q=await dbRef.collection('copias').get();const docs=q.docs.map(d=>({id:d.id,at:(d.data()||{}).at||0})).sort((a,b)=>b.at-a.at);
    for(const d of docs.slice(40))await dbRef.collection('copias').doc(d.id).delete();}catch(e){}
}
function dailyBackup(data){
  const id='d-'+today();
  try{if(localStorage.getItem(LS+'-bkday')===today())return;localStorage.setItem(LS+'-bkday',today())}catch(e){}
  saveLocalBackup(id,data,'Copia diaria');
  cloudBackup(id,data,'Copia diaria').then(ok=>{if(ok)pruneBackups()});
}
function restoreFrom(data,label){
  const cur=clone(S);
  const rid='r-'+new Date().toISOString().replace(/[:.]/g,'-');
  saveLocalBackup(rid,cur,'Antes de restaurar');cloudBackup(rid,cur,'Antes de restaurar');
  base=clone(base||cur);
  S=Object.assign(fresh(),clone(data));S.rev=(base&&base.rev)||0;
  save();toast('Restaurada: '+label);
}

      if(!dl){toast('La descarga no está disponible en esta vista');return}

    const f=e.target.files[0];if(!f)return;const rd=new FileReader();

// Conserva las imágenes ya cargadas cuando cambian cantidades o llega la sincronización.
function replaceAppContent(html){
  const app=$('#app'),images=new Map();
  app.querySelectorAll('img').forEach(img=>{const key=img.getAttribute('src');if(!images.has(key))images.set(key,[]);images.get(key).push(img)});
  const next=document.createElement('template');next.innerHTML=html;
  next.content.querySelectorAll('img').forEach(img=>{
    const previous=images.get(img.getAttribute('src'))?.shift();if(!previous)return;
    [...previous.attributes].forEach(a=>{if(!img.hasAttribute(a.name))previous.removeAttribute(a.name)});
    [...img.attributes].forEach(a=>{if(previous.getAttribute(a.name)!==a.value)previous.setAttribute(a.name,a.value)});
    img.replaceWith(previous);
  });
  app.replaceChildren(next.content);
}

function sheet(title,body,{onSave,onDelete,saveLabel='Guardar',autoFocus=true}={}){
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${body}
    <div class="actions">${onDelete?'<button class="btn danger" data-s="del">Eliminar</button>':''}<button class="btn sec" data-s="cancel">Cancelar</button>${onSave?`<button class="btn" data-s="ok">${saveLabel}</button>`:''}</div></div>`;
  const close=()=>ov.remove();
  ov.addEventListener('click',e=>{
    if(e.target===ov)return close();
    const c=e.target.closest('[data-clear]');
    if(c){c.dataset.clear.split(',').forEach(id=>{const f=ov.querySelector('#'+id);if(f)f.value=''});toast('Quitado');return}
    const b=e.target.closest('[data-s]');if(!b)return;
    e.stopPropagation();
    if(b.dataset.s==='cancel')close();
    if(b.dataset.s==='del'){onDelete();close()}
    if(b.dataset.s==='ok'){if(onSave(ov)!==false)close()}
  });
  ov.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
  document.body.appendChild(ov);
  const f=ov.querySelector('input,select,textarea');if(f&&autoFocus)f.focus();
  return ov;
}

function gcalUrl(r){
  const d=r.date.replace(/-/g,'');let dates;
  if(r.time){const[h,m]=r.time.split(':').map(Number);const e=parse(r.date);if(r.end&&r.end>r.time){const[eh,em]=r.end.split(':').map(Number);e.setHours(eh,em)}else e.setHours(h,m+30);
    dates=d+'T'+pad(h)+pad(m)+'00/'+ds(e).replace(/-/g,'')+'T'+pad(e.getHours())+pad(e.getMinutes())+'00';}
  else dates=d+'/'+addDays(r.date,1).replace(/-/g,'');
  const RR={daily:'FREQ=DAILY',every2:'FREQ=DAILY;INTERVAL=2',every3:'FREQ=DAILY;INTERVAL=3',weekly:'FREQ=WEEKLY',monthly:'FREQ=MONTHLY',yearly:'FREQ=YEARLY'};
  let tz='Europe/Madrid';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||tz}catch(e){}
  let u='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(r.title)+'&dates='+dates+'&ctz='+encodeURIComponent(tz);
  if(r.notes)u+='&details='+encodeURIComponent(r.notes);
  if(r.place)u+='&location='+encodeURIComponent(r.place);
  const rr=r.repeat==='custom'?(r.every>0?'FREQ='+{d:'DAILY',w:'WEEKLY',m:'MONTHLY'}[r.unit||'m']+';INTERVAL='+r.every:''):RR[r.repeat];
  if(rr)u+='&recur='+encodeURIComponent('RRULE:'+rr);
  return u;
}

function quickNoDate(){const el=$('#qNoDate');const v=el.value.trim();if(!v)return;S.tasks.push({id:uid(),title:v,date:'',who:'yo',repeat:'none',notes:'',done:false});el.value='';save();toast('Añadida a «Para tener en cuenta»')}
function quickTask(){const el=$('#qTask');const v=el.value.trim();if(!v)return;S.tasks.push({id:uid(),title:v,date:today(),who:'yo',repeat:'none',notes:'',done:false});el.value='';save()}
const ACT={
  tab:d=>{ui.view=d.v;if(d.v==='compras'){autoStaples();autoPantry()}render();$('#app').scrollTop=0},
  quickTask, quickItem, quickNoDate, quickRemNoDate,
  toggleTask:d=>{
    const t=find(S.tasks,d.id);if(!t)return;
    if(!t.done&&t.repeat&&t.repeat!=='none'){
      let nd=nextOcc(t.date||today(),t);while(nd<=today()&&t.date<today())nd=nextOcc(nd,t);
      t.date=nd;t.lastDone=today();save();toast('Hecha. Próxima: '+relDate(nd));
    }else{t.done=!t.done;t.doneAt=t.done?today():null;save()}
  },
  editTask:d=>taskSheet(find(S.tasks,d.id)),
  newTask:d=>taskSheet(null,d.date),
  tFilter:d=>{ui.taskFilter=d.v;render()},
  pFilter:d=>{ui.personFilter=d.v;render()},
  people:peopleSheet,
  toggleRem:d=>{
    const r=find(S.reminders,d.id);if(!r)return;
    if(!r.done&&r.repeat&&r.repeat!=='none'){
      let nd=nextOcc(r.date,r);while(nd<=today()&&r.date<today())nd=nextOcc(nd,r);
      r.date=nd;save();toast('Hecho. Próximo: '+relDate(nd));
    }else{r.done=!r.done;save()}
  },
  editRem:d=>remSheet(find(S.reminders,d.id)),
  editItem:d=>itemSheet(find(S.items,d.id)),
  pickList:d=>{ui.list=d.v;render()},
  newList:()=>listSheet(null),
  editList:d=>listSheet(find(S.lists,d.id)),
  newStaple:()=>stapleSheet(null),
  editStaple:d=>stapleSheet(find(S.staples,d.id)),
  stapleAdd:d=>{const s=find(S.staples,d.id);if(!s)return;S.items.push({id:uid(),listId:s.listId,name:s.name,section:s.section||'Otros',qty:'',by:'',done:false});save();toast(s.name+' añadido a la lista')},
  petDone:d=>{const x=find(S.pet,d.id);if(!x)return;x.last=today();x.log=[...(x.log||[]),today()];x.next='';x.time='';if(!petHistory().some(e=>e.careId===x.id&&e.date===today()&&e.src==='log'))S.petLog.push({id:uid(),date:today(),kind:x.kind,title:x.name,notes:'',careId:x.id});save();const nd=petDue(x);toast(nd?'Hecho. Próxima vez: '+relDate(nd):'Hecho')},
  editPet:d=>petSheet(find(S.pet,d.id)),
  ringoTab:d=>{ui.ringoTab=d.v;render()},
  histKind:d=>{ui.histKind=d.v;render()},
  editHist:d=>{const e=petHistory().find(x=>x.id===d.id);if(e)histSheet(e)},
  newEvent:d=>eventSheet(null,d.date),
  editEvent:d=>eventSheet(find(S.events,d.id)),
  toTomorrow:d=>{const t=find(S.tasks,d.id);if(!t)return;t.date=addDays(today(),1);save();toastUndo('Pasada a mañana')},
  toToday:d=>{const t=find(S.tasks,d.id);if(!t)return;t.date=today();save();toastUndo('Pasada a hoy')},
  allToToday:()=>{const t0=today();let n=0;S.tasks.forEach(t=>{if(!t.done&&t.date&&t.date<t0){t.date=t0;n++}});if(!n)return;save();toastUndo(n+' tareas pasadas a hoy')},
  navPos:d=>{ui.navPos=d.v;ui.navAsked=true;savePrefs();render();$('#app').scrollTop=0;toast(d.v==='top'?'Pestañas arriba en este móvil':'Pestañas abajo')},
  backups:()=>backupsSheet(),
  saveNote:d=>saveNote(d.v),
  sendMsg:()=>sendMsg(),
  delMsg:()=>{if(!S.board.cur)return;delete S.board.cur;save();toastUndo('Mensaje borrado')},
  editNote:d=>noteSheet(find(S.notes,d.id)),
  logout:(d,el)=>{if(el.dataset.ok!=='1'){el.dataset.ok='1';el.textContent='¿Seguro? Se borrarán los datos de este móvil (no los de la casa). Pulsa otra vez';return}window.casaLogout()},
  calMode:d=>{ui.calMode=d.v;render()},
  month:d=>{const v=+d.v;ui.month=v===0?0:(ui.month||0)+v;ui.calDay=null;render()},
  calDay:d=>{ui.calDay=d.v;render()},
  week:d=>{const v=+d.v;ui.week=v===0?0:ui.week+v;render()}
};
Object.assign(ACT,CK_ACT);
document.addEventListener('click',e=>{
  if(e.target.closest('.overlay'))return;
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=ACT[el.dataset.act];if(f)f(el.dataset,el);
});
document.addEventListener('input',e=>{if(e.target.id==='qHist'){ui.histQ=e.target.value;clearTimeout(ui._ht);ui._ht=setTimeout(()=>{render();const f=$('#qHist');if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length)}},250)}});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.target.closest('.overlay'))return;
  if(e.target.id==='qTask')quickTask();
  if(e.target.id==='qNoDate')quickNoDate();
  if(e.target.id==='qRemNoDate')quickRemNoDate();
  if(e.target.id==='qNoteR')saveNote('qNoteR');
  if(e.target.id==='qItem'||e.target.id==='qQty')quickItem();
});
$('#fab').addEventListener('click',()=>{ui.view==='hoy'?addChooser(today()):ui.view==='semana'?eventSheet(null,ui.calDay):ui.view==='recordar'?remSheet(null):ui.view==='ringo'?(ui.ringoTab==='hist'?histSheet(null):petSheet(null)):taskSheet(null)});

/* ---------- arranque ---------- */
if(ui.view==='pareja')ui.view='hoy';
if(ui.view==='menu'){ui.view='compras';if(!ui.ckTab||ui.ckTab==='menu')ui.ckTab='productos'}
if(S.coupleChecks||S.coupleIdea){stripOld(S);persistLocal()}
['coupleWho','coupleEdit','coupleDraft','ideaOff'].forEach(k=>delete ui[k]);
if(!S.lists.find(l=>l.id===ui.list))ui.list=S.lists[0].id;
lastSaved=clone(S);
if(migratePeople())save();
autoStaples();
render();
ckShared();
initCloud();
// Si la barra inferior queda fuera de la pantalla (algunos accesos directos de iPhone), se muestra la barra de arriba
try{
  // Si el visor corta la parte de abajo, se mide cuánto queda oculto y se sube la barra esa distancia
  const setOff=v=>document.documentElement.style.setProperty('--nav-off',v+'px');
  const sent=document.createElement('div');sent.setAttribute('aria-hidden','true');
  sent.style.cssText='position:fixed;left:0;right:0;top:0;bottom:0;pointer-events:none;opacity:0;z-index:-1';
  document.body.appendChild(sent);
  const th=[];for(let i=0;i<=100;i++)th.push(i/100);
  new IntersectionObserver(es=>{const e=es[es.length-1];if(!e.isIntersecting)return;
    const hidden=Math.round(e.boundingClientRect.bottom-e.intersectionRect.bottom);setOff(hidden>2&&hidden<500?hidden:0);
  },{threshold:th}).observe(sent);
  new IntersectionObserver(es=>{const e=es[es.length-1];document.body.classList.toggle('nav-hidden',!e.isIntersecting)},{threshold:[0,.01]}).observe($('nav.tabs'));
}catch(e){}
// Cambio de día con la app abierta
// Hoy: actualizar el saludo y la hora sin tener que tocar nada (si no estás escribiendo ni con un formulario abierto)
let lastGreet='';setInterval(()=>{const h=new Date().getHours();const g=h>=6&&h<13?'d':h>=13&&h<21?'t':'n';
  if(g!==lastGreet){lastGreet=g;const a=document.activeElement;if(ui.view==='hoy'&&!document.querySelector('.overlay')&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render()}},30000);
let lastDay=today();setInterval(()=>{if(today()!==lastDay){lastDay=today();autoStaples();render()}},60000);
</script>
<script>
// Al abrir la app se busca una versión nueva; si la hay, se recarga sola (salvo con un formulario abierto)
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  const had=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded&&!document.querySelector('.overlay')){reloaded=true;location.reload()}});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
  }).catch(()=>{}));
}
</script>
